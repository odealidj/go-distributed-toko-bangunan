name: ci

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.3'

      - name: Verify proto contracts
        run: make proto-validate

      - name: Run unit tests
        run: make test-unit

      - name: Build all services
        run: make build-all

  integration-e2e:
    runs-on: ubuntu-latest
    needs: test-build
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'

      - name: Run integration and e2e stack
        env:
          COMPOSE: docker compose
          CI_INTEGRATION_AUTO_CLEANUP: '0'
        run: make ci-integration

      - name: Compose status on failure
        if: failure()
        run: docker compose --profile app ps

      - name: Compose logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color > ci-compose.log || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-compose-logs
          path: ci-compose.log

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service_name: order-service
            service_path: services/order-service
          - service_name: catalog-inventory-service
            service_path: services/catalog-inventory-service
          - service_name: payment-service
            service_path: services/payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build \
            --file deployments/docker/service.Dockerfile \
            --build-arg SERVICE_PATH=${{ matrix.service_path }} \
            --tag ${{ matrix.service_name }}:ci .
