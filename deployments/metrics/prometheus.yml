global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-service
    static_configs:
      - targets:
          - order-service:8080

  - job_name: catalog-inventory-service
    static_configs:
      - targets:
          - catalog-inventory-service:8081

  - job_name: payment-service
    static_configs:
      - targets:
          - payment-service:8082

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
